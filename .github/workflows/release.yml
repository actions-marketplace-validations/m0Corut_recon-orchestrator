name: release

# v* tag'i push edilince paketi derler ve PyPI'a trusted publishing ile yayınlar.
# ÖN KOŞUL (bir kez, PyPI web arayüzünde): pypi.org'da projeyi "trusted publisher"
# olarak ekle — owner: m0Corut, repo: recon-orchestrator, workflow: release.yml.
# Böylece API token'a gerek kalmaz. Ayrıntı: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing için zorunlu
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
