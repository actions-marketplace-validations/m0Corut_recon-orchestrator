name: recon-scan

# Örnek: haftalık zamanlı + elle tetiklenebilir güvenlik taraması.
# TARGET'ı kendi izinli sisteminle değiştir. Bu workflow, reusable action'ı kullanır.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Taranacak hedef (yetkili olmalısın)"
        required: true
  schedule:
    - cron: "0 6 * * 1"   # her Pazartesi 06:00 UTC

permissions:
  security-events: write   # SARIF upload
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run recon-orchestrator
        uses: m0Corut/recon-orchestrator@main
        with:
          target: ${{ github.event.inputs.target || 'https://example.com' }}
          modules: "headers,cors,content,dns"
          fail-on-new: "high"
          lang: "en"
