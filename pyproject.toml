[project]
name = "recon-orchestrator"
dynamic = ["version"]
description = "Authorized security-scan tool orchestrator (nmap/nuclei/testssl + built-in checks) with Markdown/JSON/SARIF reports."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]
keywords = ["security", "pentesting", "recon", "nuclei", "nmap", "sarif", "appsec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dns = [
    "dnspython>=2.4",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "mypy>=1.8",
    "types-requests",
    "dnspython>=2.4",
]

[project.scripts]
recon = "recon.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "recon.__version__" }

[tool.setuptools.package-data]
recon = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["recon*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# BLE001 (blind except) is intentional: a single module failure must not abort
# the whole scan. S112 try/except/continue in cors probing is intentional too.
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"recon/report_html.py" = ["E501"]  # inline CSS has long lines by design
"recon/trend.py" = ["E501"]        # inline CSS, same as report_html

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
# loose to start; tighten over time
check_untyped_defs = true
